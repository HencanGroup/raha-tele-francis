name: Deploy RAHA

on:
  push:
    branches:
      - develop
      - main

jobs:

  #################################################
  # STAGING DEPLOY (develop branch)
  #################################################

  deploy_staging:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm push to develop
        run: |
          echo ""
          echo "=============================="
          echo "Pushed to develop branch"
          echo "=============================="
          echo "Commit: $(git log -1 --pretty=%B)"
          echo ""
          echo "GitHub webhook will trigger deployment"
          echo "to staging.raha-tele.com automatically."


  #################################################
  # PRODUCTION DEPLOY (main branch)
  #################################################

  deploy_production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm push to main
        run: |
          echo ""
          echo "=============================="
          echo "Pushed to main branch"
          echo "=============================="
          echo "Commit: $(git log -1 --pretty=%B)"
          echo ""
          echo "GitHub webhook will trigger deployment"
          echo "to raha-tele.com automatically."
