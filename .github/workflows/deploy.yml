name: Deploy RAHA-TELE

on:
  push:
    branches:
      - main
      - develop

jobs:

  #################################################
  # STAGING DEPLOY (develop branch)
  #################################################

  deploy_staging:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          eval $(ssh-agent -s)
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-add ~/.ssh/id_ed25519
          echo "StrictHostKeyChecking no" >> ~/.ssh/config
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts || true

      - name: Clone or pull code
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'

          set -e

          echo ""
          echo "=============================="
          echo "🚀 STARTING STAGING DEPLOYMENT"
          echo "=============================="

          if [ ! -d "${{ secrets.REMOTE_DIR }}" ]; then
            echo "  → Directory does not exist, creating..."
            mkdir -p ${{ secrets.REMOTE_DIR }}
            echo "✅ Directory created: ${{ secrets.REMOTE_DIR }}"
          else
            echo "  → Directory already exists, skipping creation..."
          fi

          echo "━━━📂 Changing into directory..."
          cd ${{ secrets.REMOTE_DIR }}
          echo "✅ Now in: $(pwd)"

          if [ ! -d ".git" ]; then
            echo "  → No repository found. Cloning..."
            git clone --branch develop ${{ secrets.REPO_URL }} .
            echo "✅ Repository cloned (develop)."
          else
            echo "  → Repository exists. Pulling latest code..."
            git fetch origin
            git checkout develop
            git pull origin develop
            echo "✅ Code updated to origin/develop."
          fi

          EOF

      - name: Upload .env
        run: |
          cat << 'EOF' > .env.remote
          ${{ secrets.APP_ENV_FILE }}
          EOF

          scp -P ${{ secrets.SSH_PORT }} .env.remote \
          ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_DIR }}/.env

      - name: Run staging deployment tasks
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << EOF

          set -e

          cd ${{ secrets.REMOTE_DIR }}
          echo "✅ Now in: \$(pwd)"

          echo "━━━📦 Installing PHP dependencies..."
          composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
          echo "✅ PHP dependencies installed."

          echo "━━━📦 Installing npm dependencies..."
          npm ci
          echo "✅ npm dependencies installed."

          echo "━━━🏗️ Building frontend assets..."
          npm run build
          echo "✅ Frontend assets built."

          echo "━━━🗃️ Running database migrations..."
          php artisan migrate --force --no-interaction
          echo "━━━🌱 Seeding database..."
          php artisan db:seed --force --no-interaction
          echo "✅ Migrations & seeding complete."

          echo "━━━🧹 Clearing cache..."
          php artisan optimize:clear
          echo "✅ Cache cleared."

          echo "━━━🛡️ Generating Shield permissions..."
          php artisan shield:generate --all --panel=admin-panel
          echo "✅ Shield permissions generated."

          echo "━━━⚡ Caching config, routes and icons..."
          php artisan config:cache
          php artisan route:cache
          php artisan icons:cache
          echo "✅ Caches set."

          echo "━━━🔗 Creating storage symlink..."
          php artisan storage:link || true
          echo "✅ Storage symlink done."

          echo "━━━🔐 Setting permissions..."
          chown -R www-data:www-data storage bootstrap/cache
          chmod -R 775 storage bootstrap/cache
          echo "✅ Permissions set."

          echo "━━━🔄 Restarting queue workers..."
          php artisan queue:restart
          echo "✅ Queue workers restarted."

          echo ""
          echo "=============================="
          echo "✅ STAGING DEPLOYMENT COMPLETE 🎉"
          echo "=============================="

          EOF


  #################################################
  # PRODUCTION DEPLOY (main branch)
  #################################################

  deploy_production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          eval $(ssh-agent -s)
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-add ~/.ssh/id_ed25519
          echo "StrictHostKeyChecking no" >> ~/.ssh/config
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts || true

      - name: Clone or pull code
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'

          set -e

          echo ""
          echo "=============================="
          echo "🚀 STARTING PRODUCTION DEPLOYMENT"
          echo "=============================="

          if [ ! -d "${{ secrets.REMOTE_DIR }}" ]; then
            echo "  → Directory does not exist, creating..."
            mkdir -p ${{ secrets.REMOTE_DIR }}
            echo "✅ Directory created: ${{ secrets.REMOTE_DIR }}"
          else
            echo "  → Directory already exists, skipping creation..."
          fi

          echo "━━━📂 Changing into directory..."
          cd ${{ secrets.REMOTE_DIR }}
          echo "✅ Now in: $(pwd)"

          if [ ! -d ".git" ]; then
            echo "  → No repository found. Cloning..."
            git clone --branch main ${{ secrets.REPO_URL }} .
            echo "✅ Repository cloned (main)."
          else
            echo "  → Repository exists. Pulling latest code..."
            git fetch origin
            git checkout main
            git pull origin main
            echo "✅ Code updated to origin/main."
          fi

          EOF

      - name: Upload .env
        run: |
          cat << 'EOF' > .env.remote
          ${{ secrets.APP_ENV_FILE }}
          EOF

          scp -P ${{ secrets.SSH_PORT }} .env.remote \
          ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_DIR }}/.env

      - name: Run production deployment tasks
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << EOF

          set -e

          cd ${{ secrets.REMOTE_DIR }}
          echo "✅ Now in: \$(pwd)"

          echo "━━━📦 Installing PHP dependencies..."
          composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
          echo "✅ PHP dependencies installed."

          echo "━━━📦 Installing npm dependencies..."
          npm ci
          echo "✅ npm dependencies installed."

          echo "━━━🏗️ Building frontend assets..."
          npm run build
          echo "✅ Frontend assets built."

          echo "━━━🗃️ Running database migrations..."
          php artisan migrate --force --no-interaction
          echo "━━━🌱 Seeding database..."
          php artisan db:seed --force --no-interaction
          echo "✅ Migrations & seeding complete."

          echo "━━━🧹 Clearing cache..."
          php artisan optimize:clear
          echo "✅ Cache cleared."

          echo "━━━🛡️ Generating Shield permissions..."
          yes | php artisan shield:install admin --no-interaction
          yes | php artisan shield:generate --all --panel=admin-panel
          echo "✅ Shield permissions generated."

          echo "━━━⚡ Caching config, routes and icons..."
          php artisan config:cache
          php artisan route:cache
          php artisan icons:cache
          echo "✅ Caches set."

          echo "━━━🔗 Creating storage symlink..."
          php artisan storage:link || true
          echo "✅ Storage symlink done."

          echo "━━━🔐 Setting permissions..."
          chown -R www-data:www-data storage bootstrap/cache
          chmod -R 775 storage bootstrap/cache
          echo "✅ Permissions set."

          echo "━━━🔄 Restarting queue workers..."
          php artisan queue:restart
          echo "✅ Queue workers restarted."

          echo ""
          echo "=============================="
          echo "✅ PRODUCTION DEPLOYMENT COMPLETE 🎉"
          echo "=============================="

          EOF