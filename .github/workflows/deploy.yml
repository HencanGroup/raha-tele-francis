name: Deploy RAHA

on:
  push:
    branches:
      - develop
      - main

jobs:

  #################################################
  # STAGING DEPLOY (develop branch)
  #################################################

  deploy_staging:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get commit message
        id: commit
        run: |
          MSG=$(git log -1 --pretty=%B | tr '\n' ' ')
          echo "msg=${MSG}" >> $GITHUB_OUTPUT

      - name: Trigger staging deployment
        run: |
          echo ""
          echo "=============================="
          echo "🚀 TRIGGERING STAGING DEPLOY"
          echo "=============================="

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            "https://staging.raha-tele.com/deploy.php")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Deployment trigger failed"
            exit 1
          fi

          echo "✅ Staging deployment triggered successfully"
          echo "Commit: ${{ steps.commit.outputs.msg }}"


  #################################################
  # PRODUCTION DEPLOY (main branch)
  #################################################

  deploy_production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get commit message
        id: commit
        run: |
          MSG=$(git log -1 --pretty=%B | tr '\n' ' ')
          echo "msg=${MSG}" >> $GITHUB_OUTPUT

      - name: Trigger production deployment
        run: |
          echo ""
          echo "=============================="
          echo "🚀 TRIGGERING PRODUCTION DEPLOY"
          echo "=============================="

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            "https://raha-tele.com/deploy.php")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Deployment trigger failed"
            exit 1
          fi

          echo "✅ Production deployment triggered successfully"
          echo "Commit: ${{ steps.commit.outputs.msg }}"
